apiVersion: guardrails/v1
kind: GuardrailPolicy
enabled: true

metadata:
  name: gateway-e2e
  version: 1

defaults:
  input_action: allow
  runtime_failure_mode: closed
  maximum_retries: 1

input:
  - id: redact-personal-data
    description: Redact supported PII before sending messages to the model.
    detector: pii
    entities:
      - EMAIL
      - PHONE_NUMBER
      - CREDIT_CARD
    action:
      type: redact

output:
  - id: require-gateway-check-response
    validator: json_schema
    schema_ref: schemas/gateway-check-response.json
    on_failure:
      type: retry
      maximum_retries: 1
      repair_prompt: Correct the gateway check response to match the schema.
