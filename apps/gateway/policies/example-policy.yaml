apiVersion: guardrails/v1
kind: GuardrailPolicy
enabled: true

metadata:
  name: gateway-e2e
  version: 2

defaults:
  input_action: allow
  input_execution_mode: sequential
  runtime_failure_mode: closed
  maximum_retries: 1

input:
  - id: redact-personal-data
    description: Redact supported PII before sending messages to the model.
    detector: pii
    entities:
      - EMAIL
      - PHONE_NUMBER
      - IP_ADDRESS
      - API_KEY
      - JWT
      - PRIVATE_KEY
      - CLOUD_CREDENTIAL
      - CREDIT_CARD
      - DATABASE_CONNECTION_STRING
    action:
      type: redact

  # Start in shadow mode. Change to block only after reviewing deployment data.
  - id: inspect-user-prompt-injection
    description: Run the local classifier after PII redaction.
    detector: prompt_injection
    roles:
      - user
    action:
      type: allow

