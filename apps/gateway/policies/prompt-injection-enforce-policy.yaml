apiVersion: guardrails/v1
kind: GuardrailPolicy
enabled: true

metadata:
  name: gateway-layer-2-smoke
  version: 1

defaults:
  input_action: allow
  input_execution_mode: parallel
  runtime_failure_mode: closed
  maximum_retries: 1

input:
  - id: redact-personal-data
    detector: pii
    entities:
      - EMAIL
      - PHONE_NUMBER
      - IP_ADDRESS
      - API_KEY
      - JWT
      - PRIVATE_KEY
      - CLOUD_CREDENTIAL
      - CREDIT_CARD
      - DATABASE_CONNECTION_STRING
    action:
      type: redact

  - id: block-user-prompt-injection
    detector: prompt_injection
    roles:
      - user
    action:
      type: block
